<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QQ农场登录系统</title>
<style>
  :root {
    --bg-from: #0b1120;
    --bg-to: #141d2e;
    --card: rgba(24, 34, 52, 0.92);
    --card-border: rgba(255, 255, 255, 0.06);
    --fg: #e8eef7;
    --muted: #94a3b8;
    --blue: #3b82f6;
    --blue-light: #60a5fa;
    --cyan: #38bdf8;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg-from) 0%, var(--bg-to) 100%);
    color: var(--fg);
    font: 15px/1.55 var(--font);
    padding-bottom: 32px;
  }
  .app { width: 100%; max-width: 480px; margin: 0 auto; padding: 22px 16px 0; }

  /* header */
  .hero { text-align: center; margin-bottom: 22px; }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #60a5fa 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero .sub { color: var(--muted); font-size: 13px; letter-spacing: 0.5px; margin: 0 0 12px; }
  .conn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--card-border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.blue { background: var(--blue-light); box-shadow: 0 0 8px var(--blue-light); }

  /* cards */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600;
    color: #fff; background: var(--blue); cursor: pointer; transition: .15s;
    box-shadow: 0 4px 14px rgba(59,130,246,0.35);
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.full { width: 100%; margin-top: 12px; }
  .btn .icon { font-size: 15px; }
  .link { background: transparent; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; }
  .link:hover { color: var(--fg); }

  /* QR */
  .qr-wrap { display: flex; justify-content: center; margin: 16px 0 14px; }
  .qr-area {
    width: 210px; height: 210px; border-radius: 16px; background: #fff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.06);
  }
  .qr-area img { width: 100%; height: 100%; object-fit: contain; }
  .qr-placeholder {
    color: #6b7280; font-size: 14px; text-align: center; padding: 24px;
    cursor: pointer; user-select: none;
  }
  .qr-area.has-img { background: #fff; }
  .qr-loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.85); color: #374151; font-size: 13px;
  }
  .qr-loading.show { display: flex; }

  /* steps */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 0; color: #b8c5d8; font-size: 14px;
  }
  .steps .num {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(59,130,246,0.18); color: var(--blue-light);
    font-weight: 700; font-size: 13px;
  }

  /* foot bar */
  .foot-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 12px;
    border-top: 1px solid var(--card-border);
    color: var(--muted); font-size: 13px;
  }
  .foot-bar .state { font-weight: 600; }

  /* code card */
  .code-block {
    background: rgba(11,17,32,0.8); border: 1px dashed rgba(96,165,250,0.25);
    border-radius: 12px; padding: 14px; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--cyan); font-size: 14px; line-height: 1.5;
  }
  .code-tip { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* logs */
  .log-card { display: flex; flex-direction: column; }
  .log-list {
    max-height: 230px; overflow-y: auto; padding-right: 4px;
    font-size: 12.5px; line-height: 1.6; color: var(--muted);
  }
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .log-item { display: flex; gap: 8px; margin: 4px 0; }
  .log-item .ts { color: #64748b; font-family: ui-monospace, monospace; white-space: nowrap; }
  .log-item .tag { margin-right: 2px; font-weight: 700; }
  .log-info .tag { color: var(--blue-light); }
  .log-info .msg { color: #a8c6f0; }
  .log-ok .tag { color: var(--green); }
  .log-ok .msg { color: #86efac; }
  .log-err .tag { color: var(--red); }
  .log-err .msg { color: #fca5a5; }
  .log-muted .tag { color: #64748b; }

  /* password modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal.show { display: flex; }
  .modal .card { width: 100%; max-width: 340px; }
  .modal input {
    width: 100%; margin-top: 12px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--card-border); background: rgba(11,17,32,0.8);
    color: var(--fg); font-size: 14px;
  }
  .modal .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* 只读文本框：授权码，便于手机端点按全选复制 */
  .code-text {
    width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(96,165,250,0.28); background: rgba(11,17,32,0.9);
    color: var(--cyan); font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.6; resize: none; -webkit-user-select: text; user-select: text;
    white-space: pre-wrap; word-break: break-all;
  }
  .code-text { min-height: 56px; line-height: 1.5; }
  .code-text:focus { outline: none; border-color: var(--cyan); }
  .code-text::placeholder { color: #475569; }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <h1>QQ农场登录系统</h1>
    <p class="sub">Car Login System · 扫码取授权码</p>
    <div class="conn" id="connStatus"><span class="dot red"></span><span>未连接</span></div>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>扫码登录</h2>
      <button class="btn" id="refreshBtn"><span class="icon">↻</span>刷新二维码</button>
    </div>

    <div class="qr-wrap">
      <div class="qr-area" id="qrArea">
        <div class="qr-placeholder" id="qrPlaceholder">点击生成二维码</div>
        <img id="qrImg" alt="QQ二维码" style="display:none" />
        <div class="qr-loading" id="qrLoading"><span>生成中…</span></div>
      </div>
    </div>

    <ol class="steps">
      <li><span class="num">1</span>点击“刷新二维码”获取登录二维码</li>
      <li><span class="num">2</span>使用手机扫描二维码</li>
      <li><span class="num">3</span>确认登录，系统将自动获取授权码</li>
    </ol>

    <div class="foot-bar">
      <span class="state" id="footText">等待扫码</span>
      <span id="footTimer">--:--</span>
    </div>
  </section>

  <section class="card" id="codeCard" style="display:none">
    <div class="card-head"><h2>授权码</h2></div>
    <textarea id="codeVal" class="code-text" readonly placeholder="—"></textarea>
    <p class="code-tip">一次性授权码，请尽快回填到农场bot 账号的 code 字段。可点「全选授权码」或直接长按文本框复制。</p>
    <button class="btn full" id="copyBtn">全选授权码</button>
  </section>

  <section class="card log-card">
    <div class="card-head">
      <h2>系统日志</h2>
      <button class="link" id="clearLog">清空</button>
    </div>
    <div class="log-list" id="logList"></div>
  </section>
</div>

<div class="modal" id="pwModal">
  <div class="card">
    <h2 style="margin:0 0 4px">访问控制</h2>
    <p class="sub" style="margin:0 0 10px">该页面已启用密码保护</p>
    <input id="pwInput" type="password" placeholder="请输入访问密码" autocomplete="off" />
    <div class="err" id="pwErr"></div>
    <button class="btn full" id="pwOk">进入</button>
  </div>
</div>

<script>
const PW_KEY = 'napcat_code_web_pwd';
let owner = 'token:web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
let pollTimer = null, timerTimer = null;
let hadQr = false;
let qrStartMs = 0, lastUpdatedAt = null;
let gettingCode = false, released = false;

const $ = (id) => document.getElementById(id);
const fmtTime = (d) => {
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
};
const fmtElapsed = (ms) => {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
};

// 复制文本：优先 navigator.clipboard（HTTPS/桌面），失败或不支持时回退到
// 临时 textarea + execCommand('copy')，兼容手机端 HTTP（非安全上下文）场景。
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand 复制失败'));
    } catch (e) {
      reject(e);
    }
  });
}

function log(type, msg) {
  const list = $('logList');
  const div = document.createElement('div');
  div.className = `log-item log-${type}`;
  let tag = '·';
  if (type === 'info') tag = 'ℹ';
  if (type === 'ok') tag = '✓';
  if (type === 'err') tag = '✗';
  div.innerHTML = `<span class="ts">${fmtTime(new Date())}</span><span><span class="tag">${tag}</span><span class="msg">${msg}</span></span>`;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}

function getPw() { return sessionStorage.getItem(PW_KEY) || ''; }
function setPw(v) { sessionStorage.setItem(PW_KEY, v); }

function setConn(text, cls) {
  const el = $('connStatus');
  el.innerHTML = `<span class="dot ${cls}"></span><span>${text}</span>`;
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const pw = getPw();
  if (pw) headers['x-auth-pwd'] = pw;
  const opt = { method, headers };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch('/api/bridge' + path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) { data = { ok: false, error: '响应解析失败' }; }
  if (res.status === 403 && data && data.needAuth) { showPwModal(); throw new Error('NEED_AUTH'); }
  return { status: res.status, data };
}

function showPwModal() {
  $('pwModal').classList.add('show');
  $('pwInput').focus();
}

function setQrLoading(v) {
  $('qrLoading').classList.toggle('show', v);
  $('refreshBtn').disabled = v;
}

function showQr(qrcode) {
  const area = $('qrArea');
  const img = $('qrImg');
  const ph = $('qrPlaceholder');
  if (qrcode) {
    img.src = qrcode;
    img.style.display = 'block';
    ph.style.display = 'none';
    area.classList.add('has-img');
  } else {
    img.style.display = 'none';
    ph.style.display = 'flex';
    area.classList.remove('has-img');
  }
}

function startTimer() {
  stopTimer();
  qrStartMs = Date.now();
  timerTimer = setInterval(() => {
    $('footTimer').textContent = fmtElapsed(Date.now() - qrStartMs);
  }, 1000);
}
function stopTimer() { if (timerTimer) clearInterval(timerTimer); timerTimer = null; $('footTimer').textContent = '--:--'; }

function resetUI() {
  stopTimer();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = null;
  gettingCode = false; released = false;
  showQr(null);
  setConn('未连接', 'red');
  $('footText').textContent = '等待扫码';
  $('codeCard').style.display = 'none';
  $('codeVal').value = '—';
}

// 结束当前扫码会话：停止轮询/计时，释放扫码通道并回收 QQ 实例，回到占位。
// keepCode=true 时保留已展示的授权码（取码成功后用），否则一并清除（失效时用）。
async function endQrSession(reason, keepCode) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  stopTimer();
  showQr(null);
  released = true;
  await releaseQuiet();
  if (!keepCode) {
    $('codeCard').style.display = 'none';
    $('codeVal').value = '—';
  }
  setConn(keepCode ? '授权码已获取' : '二维码已失效', keepCode ? 'green' : 'red');
  $('footText').textContent = keepCode ? '授权码已获取' : '可重新刷新';
  log('info', (reason || '扫码会话已结束') + '，扫码通道已释放');
}

async function genQr(forceRefresh) {
  setQrLoading(true);
  setConn(forceRefresh ? '刷新二维码…' : '连接中…', 'blue');
  log('info', forceRefresh ? '正在刷新二维码…' : '正在获取登录二维码…');
  try {
    const endpoint = forceRefresh ? '/refresh?owner=' : '/qrcode?owner=';
    const { data } = await api(forceRefresh ? 'POST' : 'GET', endpoint + encodeURIComponent(owner));
    if (!data.ok) {
      log('err', '生成二维码失败：' + (data.error || '未知错误'));
      setConn('连接失败', 'red');
      return false;
    }
    const d = data.data || {};
    if (d.qrcode) showQr(d.qrcode);
    hadQr = false;
    lastUpdatedAt = d.updatedAt || Date.now();
    setConn('等待扫码', 'yellow');
    $('footText').textContent = '等待扫码';
    log('ok', '二维码已生成，请使用 QQ 扫码');
    startTimer();
    startPolling();
    return true;
  } catch (e) {
    if (e.message !== 'NEED_AUTH') {
      log('err', '网络错误：' + e.message);
      setConn('连接失败', 'red');
    }
    return false;
  } finally {
    setQrLoading(false);
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStatus, 2000);
  pollStatus();
}

async function pollStatus() {
  try {
    const { data } = await api('GET', '/status?owner=' + encodeURIComponent(owner));
    if (!data.ok) return;
    const d = data.data || {};

    // 二维码被 NapCat 自动刷新时跟随更新
    if (d.updatedAt && d.updatedAt !== lastUpdatedAt && d.hasQr) {
      lastUpdatedAt = d.updatedAt;
      try {
        const { data: img } = await api('GET', '/image?owner=' + encodeURIComponent(owner));
        if (img.ok && img.data && img.data.qrcode) showQr(img.data.qrcode);
      } catch (e) {}
    }

    if (d.loggedIn) {
      const uin = (d.profile && d.profile.uin) || '';
      setConn('已登录' + (uin ? ' QQ ' + uin : ''), 'green');
      $('footText').textContent = '已登录';
      clearInterval(pollTimer); pollTimer = null;
      log('ok', 'QQ 已登录' + (uin ? '：' + uin : ''));
      autoGetCode();
      return;
    }

    if (d.hasQr) hadQr = true;
    // 曾成功拿到过二维码，现在会话结束且二维码已失效（用户退出/超时/崩溃）→ 自动结束并回收
    if (hadQr && !d.hasQr && !d.sessionActive && !d.loggedIn) {
      endQrSession('二维码已失效', false);
      return;
    }

    if (d.sessionActive && !$('qrImg').style.display || $('qrImg').style.display === 'none') {
      // 会话已起来但前端还没图，补一张
      try {
        const { data: img } = await api('GET', '/image?owner=' + encodeURIComponent(owner));
        if (img.ok && img.data && img.data.qrcode) showQr(img.data.qrcode);
      } catch (e) {}
    }
  } catch (e) {}
}

async function autoGetCode() {
  if (gettingCode) return;
  gettingCode = true;
  log('info', '正在自动获取授权码…');
  setConn('获取授权码…', 'blue');
  try {
    const { data } = await api('POST', '/authorize', { owner, uin: '' });
    if (!data.ok) {
      log('err', '获取授权码失败：' + (data.error || '未知错误'));
      setConn('授权失败', 'red');
      return;
    }
    const d = data.data || {};
    const code = (d.authorization && (d.authorization.code || d.authorization)) || '';
    const uin = (d.profile && d.profile.uin) || '';
    $('codeVal').value = code;
    $('codeCard').style.display = 'block';
    log('ok', '授权码获取成功' + (uin ? '（QQ ' + uin + '）' : ''));
    // 取完授权码后释放扫码通道并退出本次扫码 QQ 实例，保留授权码卡片
    await endQrSession('授权码已获取', true);
  } catch (e) {
    if (e.message !== 'NEED_AUTH') log('err', '获取授权码错误：' + e.message);
  } finally {
    gettingCode = false;
  }
}

async function releaseQuiet() {
  try { await api('POST', '/release', { owner }); } catch (e) {}
}

/* events */
$('qrPlaceholder').addEventListener('click', () => {
  if ($('refreshBtn').disabled) return;
  resetUI();
  genQr(false);
});
$('refreshBtn').addEventListener('click', () => {
  resetUI();
  genQr(true);
});
$('clearLog').addEventListener('click', () => {
  $('logList').innerHTML = '';
  log('muted', '系统就绪，等待操作…');
});
function selectAllEl(el) {
  if (!el) return false;
  el.focus();
  el.select();
  try { el.setSelectionRange(0, (el.value || '').length); } catch (_) {}
  return (el.value || '').length > 0;
}

$('copyBtn').addEventListener('click', () => {
  const ta = $('codeVal');
  if (!ta.value || ta.value === '—') { log('err', '暂无可复制的授权码'); return; }
  selectAllEl(ta);
  log('ok', '已全选授权码，请复制（Ctrl/⌘+C 或长按文本框）');
});

window.addEventListener('beforeunload', () => { if (!released) releaseQuiet(); });

$('pwOk').addEventListener('click', async () => {
  const v = $('pwInput').value.trim();
  if (!v) { $('pwErr').textContent = '请输入密码'; return; }
  setPw(v);
  try {
    const r = await fetch('/api/bridge/health', { headers: { 'x-auth-pwd': v } });
    if (r.status === 403) { $('pwErr').textContent = '密码错误'; setPw(''); return; }
    $('pwModal').classList.remove('show');
    log('info', '访问认证通过，点击“刷新二维码”开始');
  } catch (e) { $('pwErr').textContent = '校验失败'; }
});
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pwOk').click(); });

/* init */
log('muted', '系统就绪，等待操作…');
log('info', '系统初始化完成（扫码取授权码版）');
showPwModal();
// 默认停在占位：不自动拉起扫码实例，校验通过后由用户点“刷新二维码”开始
(async function init() {
  const pw = getPw();
  const probe = (hd) => fetch('/api/bridge/health', hd ? { headers: { 'x-auth-pwd': pw } } : {});
  try {
    const r = await probe(pw);
    if (r.status === 403) { showPwModal(); return; }
    $('pwModal').classList.remove('show');
    log('info', '已连接到扫码服务，点击“刷新二维码”开始');
  } catch (e) {
    log('err', '无法连接到服务：' + e.message);
  }
})();
</script>
</body>
</html>
